<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoRewards Leaderboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
    <div class="title">EcoRewards <span class="leaf">🍃</span></div>
    <div class="icon">👤</div>
</header>

<main class="content">
    <section class="stats">
        <div class="card">
            <p>You have completed</p>
            <div class="circle"><span class="big">15</span><span class="label">Tasks</span></div>
        </div>
        <div class="card">
            <p>Emissions saved</p>
            <div class="circle"><span class="big">18kg</span><span class="label">Co₂e</span></div>
        </div>
    </section>

    <section class="leaderboard">
        <div class="frame">
            <ul>
                <li><span class="rank gold">1</span> Haaris <span class="score">35</span></li>
                <li><span class="rank silver">2</span> Shuaib <span class="score">15</span></li>
                <li><span class="rank bronze">3</span> Saif <span class="score">10</span></li>
                <li><span class="rank">4</span> Dishan <span class="score">8</span></li>
                <li><span class="rank">5</span> Roman <span class="score">7</span></li>
            </ul>
        </div>
    </section>
</main>

<footer class="footer">
    <div class="nav-item">⭐<br><span>Rewards</span></div>
    <div class="nav-item">🏠<br><span>Home</span></div>
    <div class="nav-item active">📊<br><span>Leaderboard</span></div>
</footer>
</body>
</html>
