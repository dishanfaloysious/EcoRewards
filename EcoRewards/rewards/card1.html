<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoRewards — Coffee Reward</title>
    <link rel="stylesheet" href="rewards.css" />
</head>

<body>

<!-- Brand row  -->
<header class="brandbar">
    <div class="brand">
        <span class="logo-text">EcoRewards</span>
        <img src="logo.png" alt="EcoRewards Logo" class="logo-img">
    </div>
    <a class="profile-btn" href="../Profile/profile.html" title="Profile">👤</a>
</header>

<!-- Reward Details -->
<main class="rewardDetails">
    <div class="rewardBox">
        <div class="rewardBadge large">3</div>
        <h2 class="rewardTitleLarge">10% Off</h2>
        <p class="rewardSubLarge">Coffee</p>

        <div class="codeSection">
            <button class="generateBtn" id="generateCodeBtn">Generate Code</button>
            <div class="codeDisplay" id="codeDisplay">---</div>
        </div>
    </div>
</main>

<!-- Bottom navigation -->
<footer class="footer">
    <a class="nav-item" href="../rewards/rewards.html">
        <div class="nav-ico">⭐</div>
        <div class="nav-txt">Rewards</div>
    </a>
    <a class="nav-item active" href="../homepage/homepage.html">
        <div class="nav-ico">🏠</div>
        <div class="nav-txt">Home</div>
    </a>
    <a class="nav-item" href="../leaderboard/leaderboard.html">
        <div class="nav-ico">📊</div>
        <div class="nav-txt">Leaderboard</div>
    </a>
</footer>

<script src="rewards.js"></script>
</body>
</html>
