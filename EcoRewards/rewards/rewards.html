<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>EcoRewards — Rewards</title>
        <link rel="stylesheet" href="rewards.css">
</head>

<body>

<!-- Status bar  -->
<div class="statusbar">
    <span class="sb-time">11:00pm</span>
    <span class="sb-signal">📶</span>
</div>

<!-- Brand row  -->
<header class="brandbar">
    <div class="brand">
        <span class="logo-text">EcoRewards</span>
        <img src="logo.png" alt="EcoRewards Logo" class="logo-img">
    </div>
    <a class="profile-btn" href="../Profile/profile.html" title="Profile">👤</a>
</header>

<!--rewards-->
    <main class="rewardsContent">
    <div class="balanceSection">
        <p class="balanceLabel">Balance</p>
        <div class="balanceCircle">
            <span class="balanceNumber" id="pointsValue">--</span>
            <span class="balanceText">Points</span>
        </div>
    </div>

    <!--shop-->
    <section class="shopSection">
        <h3 class="shopTitle">Shop</h3>
        <div class="shopGrid" id="rewardsGrid">
        </div>
    </section>
</main>

<!-- Bottom navigation -->
<footer class="footer">
    <a class="nav-item" href="../rewards/rewards.html">
        <div class="nav-ico">⭐</div>
        <div class="nav-txt">Rewards</div>
    </a>
    <a class="nav-item active" href="../homepage/homepage.html">
        <div class="nav-ico">🏠</div>
        <div class="nav-txt">Home</div>
    </a>
    <a class="nav-item" href="../leaderboard/leaderboard.html">
        <div class="nav-ico">📊</div>
        <div class="nav-txt">Leaderboard</div>
    </a>
</footer>

<script src="rewards.js"></script>
    </body>
</html>
