<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoRewards Profile</title>
    <link rel="stylesheet" href="profile.css">
</head>
<body>
<header class="header">
</header>

<main class="content">
    <h2 class="profile-heading">Welcome to your Profile</h2>

    <div class="joined-section">
        <p>You joined</p>
        <div class="joined-circle">
            <span class="joined-number">4</span>
            <span class="joined-text">Years</span>
            <span class="joined-text">Ago</span>
        </div>
    </div>

    <section class="info-card">
        <div class="info-row"><span class="info-label">Username</span><span class="info-value">greenuser21</span></div>
        <div class="info-row"><span class="info-label">Email</span><span class="info-value">green@gmail.com</span></div>
    </section>

    <section class="settings-section">
        <button class="settings-btn">Change Password</button>
        <button class="settings-btn">Notification Settings</button>
        <button class="settings-btn delete" id="deleteBtn">Delete Account</button>
        <button class="email-button" id="emailBtn">Contact Us</button>
    </section>
</main>

<div class="modal" id="deleteModal">
    <div class="modal-content">
        <p>Are you sure you want to delete this account?</p>
        <div class="modal-buttons">
            <button class="modal-btn cancel" id="cancelDelete">Cancel</button>
            <button class="modal-btn confirm" id="confirmDelete">Delete</button>
        </div>
    </div>
</div>

<footer class="footer">
    <div class="nav-item">⭐<br><span>Rewards</span></div>
    <div class="nav-item">🏠<br><span>Home</span></div>
    <div class="nav-item active">📊<br><span>Leaderboard</span></div>
</footer>

<script src="profile.js"></script>
</body>

</html>
